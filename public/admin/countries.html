<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261020"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261020"><script src="/admin/assets/admin.js?v=20261020"></script></head><body>
<div id="page"><div class="row" style="flex-wrap:wrap"><h1 id="t" style="margin:0"></h1><div class="gap"><input id="nc" maxlength="2" style="width:90px;text-transform:uppercase" placeholder="CODE"><button class="btn" id="add"></button></div></div>
<p class="mu sm" id="hint"></p><div class="box tw"><table class="tbl" id="tb"></table></div><div class="box"><h3 id="dt"></h3><div class="tw"><table id="dty"></table></div></div></div>
<script>
(async()=>{const me=await A.shell('Shipping');if(!me)return;const {T,esc,$}=A;$('#t').textContent=T('Shipping countries & rates','Pays de livraison & tarifs');$('#add').textContent='+ '+T('Add country','Ajouter un pays');$('#dt').textContent=T('Customs duty by category','Droits de douane par catégorie');
$('#hint').textContent=T('Rates are FCFA per kilo. “Featured” countries are shown first in the shop; the rest appear under “More countries”. Disabled countries cannot be selected.','Tarifs en FCFA par kilo. Les pays « vedettes » apparaissent en premier ; les autres sous « Plus de pays ». Un pays désactivé n’est plus sélectionnable.');
let rows=[];
async function load(){rows=await A.api('/api/admin/countries');
$('#tb').innerHTML=`<tr><th>${T('Country','Pays')}</th><th>${T('Region','Région')}</th><th>✈️ FCFA/kg</th><th>${T('days','jours')}</th><th>🚢 FCFA/kg</th><th>${T('days','jours')}</th><th>★</th><th>On</th><th></th></tr>`+rows.map(c=>`<tr data-r="${c.code}"><td><b>${A.flag(c.code)} ${esc(A.country(c.code))}</b> <span class="mu sm">${c.code}</span></td><td><input data-k="region" value="${esc(c.region)}" style="width:90px"></td><td><input data-k="air_per_kg" type="number" value="${c.air_per_kg}" style="width:100px"></td><td><input data-k="air_days" value="${esc(c.air_days)}" style="width:70px"></td><td><input data-k="sea_per_kg" type="number" value="${c.sea_per_kg}" style="width:100px"></td><td><input data-k="sea_days" value="${esc(c.sea_days)}" style="width:70px"></td><td><input data-k="featured" type="checkbox" ${c.featured?'checked':''} style="width:auto"></td><td><input data-k="enabled" type="checkbox" ${c.enabled?'checked':''} style="width:auto"></td><td><button class="btn alt sm" data-s="${c.code}">${T('Save','Enregistrer')}</button></td></tr>`).join('');
$$('[data-s]').forEach(b=>b.onclick=()=>save(b.dataset.s));
const cats=await A.api('/api/admin/categories');$('#dty').innerHTML=cats.map(c=>`<tr><td>${esc(c.key)}</td><td class="r"><input type="number" step="1" min="0" max="100" value="${Math.round(c.duty_rate*100)}" data-d="${c.key}" style="width:80px;display:inline-block"> %</td></tr>`).join('');
$$('[data-d]').forEach(i=>i.onchange=async()=>{await A.api('/api/admin/categories/'+i.dataset.d,{method:'PUT',body:{duty_rate:+i.value/100}});A.toast('✓')})}
async function save(code){const tr=$(`[data-r="${code}"]`);const b={};$$('[data-k]',tr).forEach(i=>b[i.dataset.k]=i.type==='checkbox'?i.checked:i.value);await A.api('/api/admin/countries/'+code,{method:'PUT',body:b});A.toast('✓ '+code)}
$('#add').onclick=async()=>{const c=$('#nc').value.trim().toUpperCase();if(!/^[A-Z]{2}$/.test(c))return A.toast('ISO code (e.g. TG)');await A.api('/api/admin/countries/'+c,{method:'PUT',body:{region:'other',air_per_kg:7500,sea_per_kg:1900,air_days:'8-14',sea_days:'40-55',featured:false,enabled:true}});$('#nc').value='';load()};load();})();
</script></body></html>
