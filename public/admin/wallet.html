<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261020"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261020"><script src="/admin/assets/admin.js?v=20261020"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="kpis" id="k"></div>
<h3 id="h1"></h3><div class="box tw"><table class="tbl" id="ho"></table></div>
<h3 id="h2" style="margin-top:22px"></h3><div class="box tw"><table class="tbl" id="tx"></table></div></div>
<script>
(async()=>{const me=await A.shell('Wallet');if(!me)return;const {T,esc,$}=A;$('#t').textContent=T('Wallet & escrow','Portefeuille & fonds retenus');
const w=await A.api('/api/admin/wallet');
$('#k').innerHTML=[[w.held,T('Held until delivery','Retenus jusqu’à livraison'),w.held?'hot':''],[w.released,T('Settled (delivered)','Réglés (livrés)'),''],[w.balances,T('Customer balances','Soldes clients'),'']].map(([v,l,c])=>`<div class="kpi ${c}"><b>${A.fcfa(v)}</b><span>${l}</span></div>`).join('');
$('#h1').textContent=T('Orders paid from balance — waiting for delivery','Commandes payées par solde — en attente de livraison');
$('#ho').innerHTML=`<tr><th>#</th><th>${T('Customer','Client')}</th><th class="r">${T('Held','Retenu')}</th><th>${T('Status','Statut')}</th></tr>`+(w.heldOrders.map(o=>`<tr><td><a href="/admin/orders.html?q=${o.code}"><b>#${o.code}</b></a><br><span class="mu sm">${A.date(o.created_at)}</span></td><td>${esc(o.name)}<br><span class="mu sm">${esc(o.email||'')}</span></td><td class="r"><b>${A.fcfa(o.escrow)}</b></td><td><select data-c="${o.code}">${A.STATUS.map((s,i)=>`<option value="${i}" ${i===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||`<tr><td class="mu">—</td></tr>`);
document.querySelectorAll('[data-c]').forEach(s=>s.onchange=async()=>{const v=+s.value;if(v===5&&!confirm(T('Mark as delivered and settle the held amount?','Marquer comme livrée et régler le montant retenu ?'))){location.reload();return}if(v===6&&!confirm(T('Cancel and refund the customer balance?','Annuler et rembourser le solde du client ?'))){location.reload();return}await A.api('/api/admin/orders/'+s.dataset.c,{method:'PATCH',body:{status:v}});A.toast('✓');location.reload()});
const L={topup:T('Top-up','Recharge'),order_pay:T('Order payment (held)','Paiement commande (retenu)'),release:T('Delivered – settled','Livrée – réglé'),refund:T('Refund','Remboursement'),adjust:T('Adjustment','Ajustement')};
$('#h2').textContent=T('Latest movements','Derniers mouvements');
$('#tx').innerHTML=`<tr><th>${T('Date','Date')}</th><th>${T('Customer','Client')}</th><th>${T('Type','Type')}</th><th class="r">${T('Amount','Montant')}</th><th class="r">${T('Balance after','Solde après')}</th></tr>`+(w.tx.map(x=>`<tr><td>${A.date(x.created_at)}</td><td>${esc(x.email)}</td><td>${L[x.type]||x.type}${x.code?` · <a href="/admin/orders.html?q=${x.code}">#${x.code}</a>`:''}${x.type==='adjust'&&x.note?`<br><span class="mu sm">${esc(x.note)}</span>`:''}</td><td class="r"><b style="color:${x.amount>0?'#0a8f5b':x.amount<0?'#c7254e':'inherit'}">${x.amount?(x.amount>0?'+':'−')+A.fcfa(Math.abs(x.amount)):'—'}</b></td><td class="r">${A.fcfa(x.balance_after)}</td></tr>`).join('')||`<tr><td class="mu">—</td></tr>`);
})();
</script></body></html>
