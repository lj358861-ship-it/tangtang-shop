<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261019"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261019"><script src="/admin/assets/admin.js?v=20261019"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="box tw"><table class="tbl" id="tb"></table></div></div>
<script>
(async()=>{const me=await A.shell('Customers');if(!me)return;const {T,esc,$}=A;$('#t').textContent=T('Customers','Clients');
const rows=await A.api('/api/admin/users');
$('#tb').innerHTML=`<tr><th>${T('Name','Nom')}</th><th>Email</th><th>${T('Phone','Téléphone')}</th><th class="r">${T('Orders','Commandes')}</th><th class="r">${T('Balance','Solde')}</th><th>${T('Lang / cur.','Langue / devise')}</th><th>${T('Joined','Inscrit')}</th><th></th></tr>`+rows.map(u=>`<tr><td><b>${esc(u.name||'—')}</b> ${u.role==='admin'?'<span class="badge">admin</span>':''}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'')}</td><td class="r">${u.orders}</td><td class="r"><b>${A.fcfa(u.balance)}</b></td><td>${esc((u.lang||'—')+' / '+(u.cur||'—'))}</td><td>${A.date(u.created_at)}</td><td><a class="btn alt sm" href="/admin/messages.html?uid=${u.id}">💬</a> <button class="btn alt sm" data-adj="${u.id}" title="${T('Adjust balance','Ajuster le solde')}">💰</button> <a class="btn alt sm" href="/admin/orders.html?q=${encodeURIComponent(u.phone||u.name||'')}">📦</a></td></tr>`).join('');
document.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.adj);
A.modal(`<div class="row"><h2 style="margin:0">💰 ${esc(r.name||r.email)}</h2><button class="btn alt sm" onclick="A.closeModal()">✕</button></div>
<p>${T('Current balance','Solde actuel')}: <b>${A.fcfa(r.balance)}</b></p>
<label>${T('Amount (FCFA) — positive to credit, negative to debit','Montant (FCFA) — positif pour créditer, négatif pour débiter')}</label><input id="ad" type="number" step="1000">
<label>${T('Note','Note')}</label><input id="an" maxlength="150"><div class="gap" style="margin-top:12px"><button class="btn" id="aok">${T('Apply','Appliquer')}</button></div>`);
document.getElementById('aok').onclick=async()=>{try{await A.api('/api/admin/users/'+r.id+'/balance',{body:{delta:+document.getElementById('ad').value,note:document.getElementById('an').value}});A.closeModal();A.toast('✓');location.reload()}catch(e){A.toast(e.message)}}});
})();
</script></body></html>
