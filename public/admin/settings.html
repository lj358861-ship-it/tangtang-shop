<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261018"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261018"><script src="/admin/assets/admin.js?v=20261018"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="g2" style="align-items:start"><div>
<div class="box"><h3 id="h1"></h3><div class="g2"><div><label id="l1"></label><input id="mo" type="number" min="0"></div><div><label id="l2"></label><input id="fp" type="number" step="0.5" min="0"></div></div>
<label id="l3"></label><div id="tiers"></div><button class="btn alt sm" id="addt" style="margin-top:6px"></button></div>
<div class="box"><h3 id="h6"></h3><div class="mu sm" id="h6p"></div><div id="ptiers"></div><button class="btn alt sm" id="addp" style="margin-top:6px"></button></div>
<div class="box"><h3 id="h2"></h3><label class="sw" style="font-weight:400;margin-bottom:8px"><input type="checkbox" id="fa" style="width:auto"> <span id="fal"></span></label><div class="g3" id="fxg"></div></div>
<div class="box"><h3 id="h3"></h3><label id="l4"></label><input id="sn"><div class="g2"><div><label>Support email</label><input id="se" type="email"></div><div><label>WhatsApp</label><input id="sw"></div></div><label id="l5"></label><textarea id="pn" rows="3"></textarea></div>
<button class="btn" id="sv"></button></div>
<div><div class="box"><h3 id="h4"></h3><label id="p1"></label><input type="password" id="cp"><label id="p2"></label><input type="password" id="np"><button class="btn alt" id="pc" style="margin-top:10px"></button></div>
<div class="box"><h3 id="h5"></h3><div class="tw" style="max-height:320px;overflow:auto"><table id="au" class="sm"></table></div></div></div></div></div>
<script>
(async()=>{const me=await A.shell('Settings');if(!me)return;const {T,esc,$}=A;
const set=(id,t)=>$('#'+id).textContent=t;set('t',T('Settings','Réglages'));set('h1',T('Orders & shipping','Commandes & transport'));set('l1',T('Minimum order (FCFA of goods) = quota 100','Commande minimum (FCFA de marchandises) = quota 100'));set('l2',T('Service fee %','Frais de service %'));set('l3',T('Shipping discount tiers: from N units → discount %','Remises transport : à partir de N unités → remise %'));set('addt','+ '+T('Add tier','Ajouter un palier'));
set('h2',T('Display currencies (1 FCFA = …)','Devises d’affichage (1 FCFA = …)'));set('fal',T('Refresh rates automatically every day','Mettre à jour les taux automatiquement chaque jour'));set('h6',T('Volume price discount (per product)','Remise de prix par quantité (par produit)'));set('h6p',T('Discount on the unit price when the client orders N units of the SAME product.','Remise sur le prix unitaire quand le client commande N unités du MÊME produit.'));set('addp','+ '+T('Add tier','Ajouter un palier'));set('h3',T('Shop','Boutique'));set('l4',T('Shop name','Nom de la boutique'));set('l5',T('Notice shown on payment page','Message affiché sur la page de paiement'));set('sv',T('Save settings','Enregistrer'));
set('h4',T('Change my password','Changer mon mot de passe'));set('p1',T('Current password','Mot de passe actuel'));set('p2',T('New password (8+ characters)','Nouveau mot de passe (8+ caractères)'));set('pc',T('Update password','Mettre à jour'));set('h5',T('Activity log','Journal d’activité'));
let tiers=[],ptiers=[];const s=await A.api('/api/admin/settings');
$('#mo').value=s.min_order;$('#fp').value=s.fee_pct;$('#fa').checked=s.fx_auto!==false;$('#fxg').innerHTML=Object.keys(s.fx).filter(k=>k!=='XAF').map(k=>`<div><label>${k}</label><input type="number" step="any" data-fx="${k}" value="${s.fx[k]}"></div>`).join('');ptiers=s.price_tiers;$('#sn').value=s.shop_name;$('#se').value=s.support_email||'';$('#sw').value=s.support_whatsapp||'';$('#pn').value=s.pay_notice||'';tiers=s.qty_tiers;
const dt=()=>{$('#tiers').innerHTML=tiers.map((t,i)=>`<div class="gap" style="margin:4px 0"><input type="number" min="0" value="${t[0]}" data-a="${i}" style="width:110px"> <span>${T('units','unités')} →</span> <input type="number" min="0" max="90" value="${t[1]}" data-b="${i}" style="width:90px"> % <button class="btn alt sm" data-r="${i}">✕</button></div>`).join('');
$$('[data-a]').forEach(i=>i.onchange=()=>tiers[+i.dataset.a][0]=+i.value);$$('[data-b]').forEach(i=>i.onchange=()=>tiers[+i.dataset.b][1]=+i.value);$$('[data-r]').forEach(b=>b.onclick=()=>{tiers.splice(+b.dataset.r,1);dt()})};dt();
const dp=()=>{$('#ptiers').innerHTML=ptiers.map((t,i)=>`<div class="gap" style="margin:4px 0"><input type="number" min="0" value="${t[0]}" data-pa="${i}" style="width:110px"> <span>${T('units','unités')} →</span> <input type="number" min="0" max="90" value="${t[1]}" data-pb="${i}" style="width:90px"> % <button class="btn alt sm" data-pr="${i}">✕</button></div>`).join('');
$$('[data-pa]').forEach(i=>i.onchange=()=>ptiers[+i.dataset.pa][0]=+i.value);$$('[data-pb]').forEach(i=>i.onchange=()=>ptiers[+i.dataset.pb][1]=+i.value);$$('[data-pr]').forEach(b=>b.onclick=()=>{ptiers.splice(+b.dataset.pr,1);dp()})};dp();
$('#addp').onclick=()=>{ptiers.push([0,0]);dp()};
$('#addt').onclick=()=>{tiers.push([0,0]);dt()};
$('#sv').onclick=async()=>{await A.api('/api/admin/settings',{method:'PUT',body:{min_order:+$('#mo').value,fee_pct:+$('#fp').value,qty_tiers:tiers,price_tiers:ptiers,fx_auto:$('#fa').checked,fx:Object.fromEntries($$('[data-fx]').map(i=>[i.dataset.fx,+i.value])),shop_name:$('#sn').value,support_email:$('#se').value,support_whatsapp:$('#sw').value,pay_notice:$('#pn').value}});A.toast('✓')};
$('#pc').onclick=async()=>{try{await A.api('/api/auth/password',{body:{current:$('#cp').value,next:$('#np').value}});A.toast('✓');$('#cp').value=$('#np').value=''}catch(e){A.toast(T('Wrong password or too short','Mot de passe incorrect ou trop court'))}};
const au=await A.api('/api/admin/audit');$('#au').innerHTML=au.map(a=>`<tr><td>${A.date(a.created_at)}</td><td>${esc(a.email||'')}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td></tr>`).join('');})();
</script></body></html>
