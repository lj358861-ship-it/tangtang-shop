<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/admin/assets/admin.css"><script src="/admin/assets/admin.js"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="g2" style="align-items:start"><div>
<div class="box"><h3 id="h1"></h3><div class="g2"><div><label id="l1"></label><input id="mo" type="number" min="0"></div><div><label id="l2"></label><input id="fp" type="number" step="0.5" min="0"></div></div>
<label id="l3"></label><div id="tiers"></div><button class="btn alt sm" id="addt" style="margin-top:6px"></button></div>
<div class="box"><h3 id="h2"></h3><div class="g3"><div><label>1 FCFA = EUR</label><input id="fe" type="number" step="0.000001"></div><div><label>1 FCFA = USD</label><input id="fu" type="number" step="0.000001"></div><div><label>1 FCFA = CNY</label><input id="fc" type="number" step="0.000001"></div></div></div>
<div class="box"><h3 id="h3"></h3><label id="l4"></label><input id="sn"><div class="g2"><div><label>Support email</label><input id="se" type="email"></div><div><label>WhatsApp</label><input id="sw"></div></div><label id="l5"></label><textarea id="pn" rows="3"></textarea></div>
<button class="btn" id="sv"></button></div>
<div><div class="box"><h3 id="h4"></h3><label id="p1"></label><input type="password" id="cp"><label id="p2"></label><input type="password" id="np"><button class="btn alt" id="pc" style="margin-top:10px"></button></div>
<div class="box"><h3 id="h5"></h3><div class="tw" style="max-height:320px;overflow:auto"><table id="au" class="sm"></table></div></div></div></div></div>
<script>
(async()=>{const me=await A.shell('Settings');if(!me)return;const {T,esc,$}=A;
const set=(id,t)=>$('#'+id).textContent=t;set('t',T('Settings','Réglages'));set('h1',T('Orders & shipping','Commandes & transport'));set('l1',T('Minimum order (FCFA of goods) = quota 100','Commande minimum (FCFA de marchandises) = quota 100'));set('l2',T('Service fee %','Frais de service %'));set('l3',T('Shipping discount tiers: from N units → discount %','Remises transport : à partir de N unités → remise %'));set('addt','+ '+T('Add tier','Ajouter un palier'));
set('h2',T('Display currency rates (indicative)','Taux d’affichage des devises (indicatifs)'));set('h3',T('Shop','Boutique'));set('l4',T('Shop name','Nom de la boutique'));set('l5',T('Notice shown on payment page','Message affiché sur la page de paiement'));set('sv',T('Save settings','Enregistrer'));
set('h4',T('Change my password','Changer mon mot de passe'));set('p1',T('Current password','Mot de passe actuel'));set('p2',T('New password (8+ characters)','Nouveau mot de passe (8+ caractères)'));set('pc',T('Update password','Mettre à jour'));set('h5',T('Activity log','Journal d’activité'));
let tiers=[];const s=await A.api('/api/admin/settings');
$('#mo').value=s.min_order;$('#fp').value=s.fee_pct;$('#fe').value=s.fx.EUR;$('#fu').value=s.fx.USD;$('#fc').value=s.fx.CNY;$('#sn').value=s.shop_name;$('#se').value=s.support_email||'';$('#sw').value=s.support_whatsapp||'';$('#pn').value=s.pay_notice||'';tiers=s.qty_tiers;
const dt=()=>{$('#tiers').innerHTML=tiers.map((t,i)=>`<div class="gap" style="margin:4px 0"><input type="number" min="0" value="${t[0]}" data-a="${i}" style="width:110px"> <span>${T('units','unités')} →</span> <input type="number" min="0" max="90" value="${t[1]}" data-b="${i}" style="width:90px"> % <button class="btn alt sm" data-r="${i}">✕</button></div>`).join('');
$$('[data-a]').forEach(i=>i.onchange=()=>tiers[+i.dataset.a][0]=+i.value);$$('[data-b]').forEach(i=>i.onchange=()=>tiers[+i.dataset.b][1]=+i.value);$$('[data-r]').forEach(b=>b.onclick=()=>{tiers.splice(+b.dataset.r,1);dt()})};dt();
$('#addt').onclick=()=>{tiers.push([0,0]);dt()};
$('#sv').onclick=async()=>{await A.api('/api/admin/settings',{method:'PUT',body:{min_order:+$('#mo').value,fee_pct:+$('#fp').value,qty_tiers:tiers,fx:{EUR:+$('#fe').value,USD:+$('#fu').value,CNY:+$('#fc').value},shop_name:$('#sn').value,support_email:$('#se').value,support_whatsapp:$('#sw').value,pay_notice:$('#pn').value}});A.toast('✓')};
$('#pc').onclick=async()=>{try{await A.api('/api/auth/password',{body:{current:$('#cp').value,next:$('#np').value}});A.toast('✓');$('#cp').value=$('#np').value=''}catch(e){A.toast(T('Wrong password or too short','Mot de passe incorrect ou trop court'))}};
const au=await A.api('/api/admin/audit');$('#au').innerHTML=au.map(a=>`<tr><td>${A.date(a.created_at)}</td><td>${esc(a.email||'')}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td></tr>`).join('');})();
</script></body></html>
