<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261018"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261018"><script src="/admin/assets/admin.js?v=20261018"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="alert sm" id="warn"></div><div class="fb"><select id="st"></select></div><div class="box tw"><table class="tbl" id="tb"></table></div></div>
<script>
(async()=>{const me=await A.shell('Payments');if(!me)return;const {T,esc,$}=A;
$('#t').textContent=T('Payments','Paiements');
$('#warn').innerHTML='🔒 '+T('PINs, CVV and full card numbers are encrypted. Click “Reveal” to see them (logged). They are erased automatically once you mark the payment Completed, Failed or Refused.','Les PIN, CVV et numéros de carte complets sont chiffrés. Cliquez sur « Afficher » pour les voir (journalisé). Ils sont effacés automatiquement dès que vous marquez le paiement Terminé, Échoué ou Refusé.');
const PS={submitted:[T('Received','Reçu'),'warn'],processing:[T('Processing','En cours'),'warn'],completed:[T('Completed','Terminé'),'ok'],failed:[T('Failed','Échoué'),'bad'],refused:[T('Refused','Refusé'),'bad']};
$('#st').innerHTML=`<option value="">${T('All','Tous')}</option>`+Object.entries(PS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');$('#st').value='submitted';
let rows=[];
async function load(){rows=await A.api('/api/admin/payments'+($('#st').value?'?status='+$('#st').value:''));
$('#tb').innerHTML=`<tr><th>${T('Date','Date')}</th><th>${T('Order','Commande')}</th><th>${T('Method','Moyen')}</th><th>${T('Payer','Payeur')}</th><th class="r">${T('Amount','Montant')}</th><th>${T('Status','Statut')}</th><th></th></tr>`+rows.map(p=>`<tr><td>${A.date(p.created_at)}</td><td><b>#${p.code}</b><br><span class="mu sm">${A.flag(p.country)} ${esc(p.email||'')}</span></td><td>${A.METHOD[p.method]}<br><span class="mu sm">${esc(p.mask||'')}</span></td><td>${esc(p.payer_name)}<br><span class="mu sm">${esc(p.payer_phone||'')}</span></td><td class="r"><b>${A.fcfa(p.amount)}</b></td><td><span class="badge ${PS[p.status][1]}">${PS[p.status][0]}</span></td><td><button class="btn sm" data-i="${p.id}">${T('Open','Ouvrir')}</button></td></tr>`).join('')||`<tr><td class="mu">—</td></tr>`;
$$('[data-i]').forEach(b=>b.onclick=()=>open(rows.find(p=>p.id==b.dataset.i)))}
function open(p){const x=p.extra||{};
A.modal(`<div class="row"><h2 style="margin:0">${A.METHOD[p.method]} — #${p.code}</h2><button class="btn alt sm" onclick="A.closeModal()">✕</button></div>
<div class="g2" style="margin:10px 0"><div><div class="mu sm">${T('Amount to charge','Montant à débiter')}</div><b class="price" style="font-size:24px">${A.fcfa(p.amount)}</b></div><div><div class="mu sm">${T('Payer','Payeur')}</div><b>${esc(p.payer_name)}</b><br>${esc(p.payer_phone||'')}</div></div>
${p.method==='other'?`<div class="box"><b>${esc(x.methodName||'')}</b><br>${T('Account','Compte')}: ${esc(x.account||'—')}<br>${T('Reference','Référence')}: ${esc(x.reference||'—')}<br>${T('Paid','Payé')}: ${esc(x.paidAmount||'—')} · ${esc(x.paidDate||'')}<br><p style="white-space:pre-wrap">${esc(x.notes||'')}</p>${p.proof_file?`<a href="/api/proof/${p.proof_file}" target="_blank"><img src="/api/proof/${p.proof_file}" style="max-width:100%;max-height:300px;border-radius:12px"></a>`:''}</div>`:
`<div id="sec">${p.has_secret?`<button class="btn alt" id="rv">🔓 ${T('Reveal secret details','Afficher les infos secrètes')}</button>`:`<div class="mu">${p.purged?T('Secret details erased after processing.','Infos secrètes effacées après traitement.'):'—'}</div>`}</div>`}
<label>${T('Admin note','Note admin')}</label><textarea id="an" rows="2">${esc(p.admin_note||'')}</textarea>
<div class="gap" style="margin-top:12px"><button class="btn alt" data-s="processing">⏳ ${T('Mark processing','En cours')}</button><button class="btn ok" data-s="completed">✓ ${T('Completed (order paid)','Terminé (commande payée)')}</button><button class="btn bad" data-s="failed">✕ ${T('Failed','Échoué')}</button><button class="btn line" data-s="refused">${T('Refused','Refusé')}</button><a class="btn alt" href="/admin/messages.html?q=${p.email}">💬</a></div>`);
const rv=$('#rv');if(rv)rv.onclick=async()=>{const r=await A.api('/api/admin/payments/'+p.id+'/reveal',{method:'POST',body:{}});const s=r.secret||{};
$('#sec').innerHTML=`<div class="secret">${p.method==='card'?`${T('Card','Carte')}: ${esc(s.number)}<br>${T('Expiry','Expiration')}: ${esc(s.expiry)}<br>CVV: ${esc(s.cvv)}<br>${T('Name','Nom')}: ${esc(p.payer_name)}`:`${T('Number','Numéro')}: ${esc(p.payer_phone)}<br>${T('Name','Nom')}: ${esc(p.payer_name)}<br>${T('Secret code','Code secret')}: ${esc(s.pin)}`}</div><div class="mu sm">${T('Use these to start the transaction manually, then set the result below.','Utilisez-les pour lancer la transaction manuellement, puis indiquez le résultat ci-dessous.')}</div>`};
$$('[data-s]',$('#modal')).forEach(b=>b.onclick=async()=>{if(['completed','failed','refused'].includes(b.dataset.s)&&!confirm(T('This will erase the secret details. Continue?','Cela effacera les infos secrètes. Continuer ?')))return;
await A.api('/api/admin/payments/'+p.id,{method:'PATCH',body:{status:b.dataset.s,admin_note:$('#an').value}});A.closeModal();A.toast('✓');load()})}
$('#st').onchange=load;load();A.onEvent=(d)=>{if(d.type==='payment')load()};})();
</script></body></html>
