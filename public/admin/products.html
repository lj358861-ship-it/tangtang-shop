<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261018"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261018"><script src="/admin/assets/admin.js?v=20261018"></script></head><body>
<div id="page"><div class="row" style="flex-wrap:wrap"><h1 id="t" style="margin:0"></h1><button class="btn" id="new"></button></div><div class="fb" style="margin-top:12px"><input id="q" placeholder="🔍"></div><div class="box tw"><table class="tbl" id="tb"></table></div></div>
<script>
(async()=>{const me=await A.shell('Products');if(!me)return;const {T,esc,$}=A;$('#t').textContent=T('Products','Produits');$('#new').textContent='+ '+T('New product','Nouveau produit');
const cfg=await A.api('/api/config');const L=['en','fr','de','es','zh'];let rows=[];
async function load(){rows=await A.api('/api/admin/products'+($('#q').value?'?q='+encodeURIComponent($('#q').value):''));
$('#tb').innerHTML=`<tr><th></th><th>${T('Product','Produit')}</th><th class="r">${T('Price','Prix')}</th><th class="r">kg</th><th class="r">MOQ</th><th></th></tr>`+rows.slice(0,200).map(p=>`<tr style="${p.active?'':'opacity:.45'}"><td><img class="pimg" src="${p.images[0]||''}"></td><td><b>${esc(p.name.en||p.name.fr)}</b><br><span class="mu sm">${p.sku} · ${esc(p.cat)}</span> ${p.needsPrice?`<span class="badge warn">${T('confirm price','prix à confirmer')}</span>`:''} ${p.isNew?'<span class="badge ok">NEW</span>':''}</td><td class="r"><b>${A.fcfa(p.final)}</b>${p.discount?`<br><span class="mu sm">-${p.discount}%</span>`:''}</td><td class="r">${p.kg}</td><td class="r">${p.moq}</td><td><button class="btn alt sm" data-e="${p.id}">${T('Edit','Modifier')}</button></td></tr>`).join('');
$$('[data-e]').forEach(b=>b.onclick=()=>edit(rows.find(p=>p.id==b.dataset.e)))}
function edit(p){p=p||{name:{},desc:{},cat:'misc',section:'g',price:0,kg:.3,discount:0,moq:1,images:[],variants:[],sizes:[],active:true,isNew:true};
const imgs=[...p.images];
const draw=()=>{A.modal(`<div class="row"><h2 style="margin:0">${p.id?T('Edit product','Modifier le produit'):T('New product','Nouveau produit')}</h2><button class="btn alt sm" onclick="A.closeModal()">✕</button></div>
<div class="g2">${L.map(l=>`<div><label>${T('Name','Nom')} (${l})</label><input data-n="${l}" value="${esc(p.name[l]||'')}"></div>`).join('')}</div>
<details><summary class="mu" style="cursor:pointer;margin-top:8px">${T('Descriptions','Descriptions')}</summary><div class="g2">${L.map(l=>`<div><label>${l}</label><textarea data-d="${l}" rows="2">${esc(p.desc[l]||'')}</textarea></div>`).join('')}</div></details>
<div class="g3"><div><label>${T('Category','Catégorie')}</label><select id="cat">${cfg.categories.map(c=>`<option ${c.key===p.cat?'selected':''}>${c.key}</option>`).join('')}</select></div><div><label>${T('Section','Rayon')}</label><select id="sec">${[['w','Women'],['m','Men'],['e','Electronics'],['g','Gifts']].map(([k,v])=>`<option value="${k}" ${k===p.section?'selected':''}>${v}</option>`).join('')}</select></div><div><label>${T('Price (FCFA)','Prix (FCFA)')}</label><input id="pr" type="number" min="0" value="${p.price}"></div></div>
<div class="g3"><div><label>${T('Weight kg / unit','Poids kg / unité')}</label><input id="kg" type="number" step="0.01" min="0" value="${p.kg}"></div><div><label>${T('Discount %','Remise %')}</label><input id="dc" type="number" min="0" max="90" value="${p.discount}"></div><div><label>MOQ</label><input id="mq" type="number" min="1" value="${p.moq}"></div></div>
<label>${T('Sizes / options (comma separated)','Tailles / options (séparées par des virgules)')}</label><input id="sz" value="${esc((p.sizes||[]).join(', '))}">
<label>${T('Design names, one per image (one per line)','Noms des designs, un par image (une ligne chacun)')}</label><textarea id="vn" rows="2">${esc((p.variants||[]).join('\n'))}</textarea>
<label>${T('Images','Images')}</label><div class="gap">${imgs.map((u,i)=>`<div style="position:relative"><img class="pimg" style="width:70px;height:70px" src="${u}"><button class="btn bad sm" style="position:absolute;top:-6px;right:-6px;padding:0 7px" data-x="${i}">×</button></div>`).join('')}<label class="btn alt sm" style="margin:0">+ ${T('Upload','Ajouter')}<input id="up" type="file" accept="image/*" multiple hidden></label></div>
<div class="gap" style="margin-top:12px"><label class="sw" style="font-weight:400"><input type="checkbox" id="ac" ${p.active?'checked':''} style="width:auto"> ${T('Visible in shop','Visible en boutique')}</label><label class="sw" style="font-weight:400"><input type="checkbox" id="nw" ${p.isNew?'checked':''} style="width:auto"> ${T('Mark as new','Marquer nouveau')}</label></div>
<div class="gap" style="margin-top:14px"><button class="btn" id="sv">${T('Save','Enregistrer')}</button>${p.id?`<button class="btn bad" id="dl">${T('Hide / delete','Masquer / supprimer')}</button>`:''}</div>`);
const m=$('#modal');$$('[data-x]',m).forEach(b=>b.onclick=()=>{collect();imgs.splice(+b.dataset.x,1);draw()});
$('#up').onchange=async(e)=>{collect();for(const f of e.target.files){const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});try{imgs.push((await A.api('/api/admin/upload',{body:{data}})).url)}catch{A.toast('Upload failed')}}draw()};
function collect(){p.name={};$$('[data-n]',m).forEach(i=>p.name[i.dataset.n]=i.value.trim());p.desc={};$$('[data-d]',m).forEach(i=>p.desc[i.dataset.d]=i.value.trim());p.cat=$('#cat').value;p.section=$('#sec').value;p.price=+$('#pr').value;p.kg=+$('#kg').value;p.discount=+$('#dc').value;p.moq=+$('#mq').value;p.sizes=$('#sz').value.split(',').map(s=>s.trim()).filter(Boolean);p.variants=$('#vn').value.split('\n').map(s=>s.trim()).filter(Boolean);p.active=$('#ac').checked;p.isNew=$('#nw').checked}
$('#sv').onclick=async()=>{collect();p.images=imgs;try{await A.api(p.id?'/api/admin/products/'+p.id:'/api/admin/products',{method:p.id?'PUT':'POST',body:p});A.closeModal();A.toast('✓');load()}catch(e){A.toast(T('Check the fields (name, price, weight)','Vérifiez les champs (nom, prix, poids)'))}};
if($('#dl'))$('#dl').onclick=async()=>{if(confirm(T('Hide this product from the shop?','Masquer ce produit de la boutique ?'))){await A.api('/api/admin/products/'+p.id,{method:'DELETE'});A.closeModal();load()}}};draw()}
$('#new').onclick=()=>edit();$('#q').oninput=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(load,300)}})();load();})();
</script></body></html>
