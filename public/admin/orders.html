<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/site.css?v=20261018"><link rel="stylesheet" href="/admin/assets/admin.css?v=20261018"><script src="/admin/assets/admin.js?v=20261018"></script></head><body>
<div id="page"><h1 id="t"></h1><div class="fb"><input id="q" placeholder="#code / name / phone"><select id="st"></select><select id="py"></select></div><div class="box tw"><table class="tbl" id="tb"></table></div></div>
<script>
(async()=>{const me=await A.shell('Orders');if(!me)return;const {T,esc,$}=A;const u=new URLSearchParams(location.search);
$('#t').textContent=T('Orders','Commandes');$('#q').value=u.get('q')||'';
$('#st').innerHTML=`<option value="">${T('All statuses','Tous statuts')}</option>`+A.STATUS.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
$('#py').innerHTML=`<option value="">${T('All payments','Tous paiements')}</option>`+Object.entries(A.PAY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');$('#py').value=u.get('pay')||'';
let rows=[];
async function load(){const p=new URLSearchParams();if($('#q').value)p.set('q',$('#q').value);if($('#st').value!=='')p.set('status',$('#st').value);if($('#py').value)p.set('pay',$('#py').value);
rows=await A.api('/api/admin/orders?'+p);
$('#tb').innerHTML=`<tr><th>#</th><th>${T('Customer','Client')}</th><th>${T('Destination','Destination')}</th><th class="r">Total</th><th>${T('Payment','Paiement')}</th><th>${T('Status','Statut')}</th></tr>`+rows.map(o=>`<tr><td><b>#${o.code}</b><br><span class="mu sm">${A.date(o.created_at)}</span></td><td>${esc(o.name)}<br><span class="mu sm">${esc(o.phone)}</span></td><td>${A.flag(o.country)} ${esc(A.country(o.country))}<br><span class="mu sm">${o.mode==='air'?'✈️':'🚢'} ${o.weight} kg · ${o.qty_total} u</span></td><td class="r"><b>${A.fcfa(o.total)}</b></td><td><span class="badge ${A.PAY[o.payment_status][1]}">${A.PAY[o.payment_status][0]}</span></td><td><select data-c="${o.code}" style="width:auto;padding:5px 8px">${A.STATUS.map((s,i)=>`<option value="${i}" ${i===o.status?'selected':''}>${s}</option>`).join('')}</select> <button class="btn alt sm" data-v="${o.code}">${T('View','Voir')}</button></td></tr>`).join('')||`<tr><td class="mu">—</td></tr>`;
$$('[data-c]').forEach(s=>s.onchange=async()=>{await A.api('/api/admin/orders/'+s.dataset.c,{method:'PATCH',body:{status:+s.value}});A.toast('✓ '+T('Status updated','Statut mis à jour'))});
$$('[data-v]').forEach(b=>b.onclick=()=>view(rows.find(o=>o.code===b.dataset.v)));}
function view(o){A.modal(`<div class="row"><h2 style="margin:0">#${o.code}</h2><button class="btn alt sm" onclick="A.closeModal()">✕</button></div>
<p>${esc(o.name)} · ${esc(o.phone)} · ${esc(o.email||'')}<br>${esc(o.address)}, ${esc(o.city)} — ${A.flag(o.country)} ${esc(A.country(o.country))}<br>${o.mode==='air'?'✈️ Air':'🚢 Sea'} · ${o.weight} kg · quota ${o.quota}/100</p>${o.notes?`<div class="alert">${esc(o.notes)}</div>`:''}
<div class="tw"><table>${o.items.map(i=>`<tr><td><img class="pimg" src="${i.image}"></td><td>${esc(i.name.en||i.name.fr)}<br><span class="mu sm">${esc(i.variant||'')} ${esc(i.size||'')}</span></td><td class="r">${i.qty} × ${A.fcfa(i.unit_price)}</td></tr>`).join('')}</table></div>
<div class="sum" style="margin-top:8px"><div class="row"><span>${T('Goods','Articles')}</span><b>${A.fcfa(o.goods)}</b></div><div class="row"><span>${T('Shipping','Transport')} (−${o.discount_pct}%)</span><b>${A.fcfa(o.shipping)}</b></div><div class="row"><span>${T('Customs','Douane')}</span><b>${A.fcfa(o.duty)}</b></div><div class="row"><span>${T('Service fee','Frais')}</span><b>${A.fcfa(o.fee)}</b></div><div class="row tot price"><span>Total</span><b>${A.fcfa(o.total)}</b></div></div>
<label>${T('Internal note','Note interne')}</label><textarea id="nt" rows="2">${esc(o.admin_note||'')}</textarea>
<div class="gap" style="margin-top:10px"><select id="ps" style="width:auto">${Object.entries(A.PAY).map(([k,v])=>`<option value="${k}" ${k===o.payment_status?'selected':''}>${v[0]}</option>`).join('')}</select><button class="btn" id="sv">${T('Save','Enregistrer')}</button><a class="btn alt" href="/admin/messages.html?uid=${o.user_id}">💬 ${T('Chat','Discuter')}</a></div>`);
$('#sv').onclick=async()=>{await A.api('/api/admin/orders/'+o.code,{method:'PATCH',body:{payment_status:$('#ps').value,admin_note:$('#nt').value}});A.closeModal();A.toast('✓');load()}}
$('#q').oninput=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(load,300)}})();$('#st').onchange=$('#py').onchange=load;load();A.onEvent=(d)=>{if(d.type==='order')load()};})();
</script></body></html>
