<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4f78"><title>Tangtang 糖糖</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>"><link rel="stylesheet" href="/css/site.css"><script src="/js/i18n.js"></script><script src="/js/app.js"></script></head><body>
<main><div class="wrap"><h1 style="font-size:30px" data-i18n="nav_cart"></h1><div id="app"></div></div></main>
<script>
TT.ready.then(async()=>{
  const {t,esc,api,$}=TT; let prods={}, last=null;
  async function render(){
    const cart=TT.cart.all(); TT.cart.badge();
    if(!cart.length){ $('#app').innerHTML=`<div class="box c"><p style="font-size:44px;margin:0">🛒</p><p class="mu">${esc(t('cart_empty'))}</p><a class="btn" href="/shop">${esc(t('hero_cta'))}</a></div>`; return; }
    const ids=[...new Set(cart.map(c=>c.id))]; const need=ids.filter(i=>!prods[i]);
    if(need.length)(await api('/api/products/batch?ids='+need.join(','))).forEach(p=>prods[p.id]=p);
    const lines=cart.filter(c=>prods[c.id]);
    $('#app').innerHTML=`<div class="pd pd2"><div id="lines"></div><div>
      <div class="box"><div id="cp"></div><div id="ms" style="margin-top:10px"></div></div><div id="q"></div><div class="box" id="bd"></div><div id="tiers"></div></div></div>`;
    $('#lines').innerHTML=lines.map(c=>{const p=prods[c.id],i=cart.indexOf(c);return `<div class="box li"><img src="${c.image||p.images[0]}" alt="">
      <div><a href="/product?id=${p.id}"><b>${esc(TT.pname(p))}</b></a><div class="mu sm">${esc(c.variant||'')}${c.variant&&c.size?' · ':''}${esc(c.size==='ONE'?t('one_size'):c.size||'')}</div>
      <div class="sm"><span class="price">${TT.money(p.final)}</span> × <input type="number" min="${p.moq}" value="${c.qty}" data-i="${i}" style="width:84px;display:inline-block;padding:5px 8px"> <span class="mu">(${esc(t('moq'))} ${p.moq})</span></div>
      <div class="sm mu" data-share="${i}"></div></div>
      <div class="c"><b>${TT.money(p.final*c.qty)}</b><br><button class="btn alt sm" data-del="${i}">✕</button></div></div>`}).join('');
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{TT.cart.del(+b.dataset.del);render()});
    document.querySelectorAll('[data-i]').forEach(inp=>inp.onchange=()=>{const p=prods[cart[+inp.dataset.i].id];TT.cart.set(+inp.dataset.i,Math.max(p.moq,Math.floor(+inp.value)||p.moq));inp.onchange=null;setTimeout(()=>render(),0)});
    const ms=TT.modeSwitch($('#ms'),()=>recalc()); TT.countryPicker($('#cp'),()=>{ms.redraw();recalc()}); recalc();
  }
  async function recalc(full){
    if(full)return render();
    const cart=TT.cart.all();
    try{
      const q=last=await api('/api/quote',{body:{lines:cart.map(c=>({id:c.id,qty:c.qty})),country:TT.country(),mode:TT.mode()}});
      $('#q').innerHTML=TT.quotaHTML(q); $('#bd').innerHTML=TT.breakdownHTML(q)+
       `<div class="sm mu" style="margin-top:6px">${TT.flag(q.country)} ${esc(TT.countryName(q.country))} · ⏱ ${q.days} ${esc(t('days'))}</div>`+
       (q.ok?`<a class="btn block" style="margin-top:12px" href="/checkout">${esc(t('checkout'))} →</a>`:`<button class="btn block" style="margin-top:12px" disabled>${esc(t('checkout'))}</button><div class="alert" style="margin-top:10px">${esc(t('quota_block',{n:TT.fcfa(q.missing)}))} <a href="/shop" style="text-decoration:underline">${esc(t('keep_shopping'))}</a></div>`);
      // each line's share of the 100% quota
      q.lines.forEach((l,i)=>{const e=document.querySelector('[data-share="'+i+'"]'); if(e)e.textContent='📊 '+t('line_share',{n:l.share})});
      const tiers=TT.cfg.settings.qty_tiers.slice().sort((a,b)=>a[0]-b[0]); const nxt=tiers.find(x=>x[0]>q.qtyTotal&&x[1]>q.discountPct);
      $('#tiers').innerHTML=`<div class="notice">🚚 ${esc(t('tier_now',{n:q.qtyTotal,d:q.discountPct}))}${nxt?' · '+esc(t('tier_next',{m:nxt[0]-q.qtyTotal,d:nxt[1]})):''}</div>`;
    }catch(e){
      if(String(e.message).startsWith('below_moq')){const [,id,m]=e.message.split(':');const c=cart.map(x=>x.id==id&&x.qty<m?{...x,qty:+m}:x);TT.cart.save(c);return render();}
      $('#bd').innerHTML='<div class="alert bad">'+esc(TT.errMsg(e))+'</div>';
    }
  }
  render();
});
</script></body></html>
