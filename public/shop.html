<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4f78"><title>Tangtang 糖糖</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>"><link rel="stylesheet" href="/css/site.css"><script src="/js/i18n.js"></script><script src="/js/app.js"></script></head><body>
<main><div class="wrap">
<div class="row" style="flex-wrap:wrap;gap:10px"><h1 style="font-size:30px;margin:0" data-i18n="nav_shop"></h1>
<div class="gap" style="flex:1;justify-content:flex-end"><input id="q" style="max-width:320px;border-radius:999px" data-i18n-ph="search"><select id="sort" style="width:auto;border-radius:999px"><option value="" data-i18n="sort_def"></option><option value="price_asc" data-i18n="sort_asc"></option><option value="price_desc" data-i18n="sort_desc"></option></select></div></div>
<div class="chips" id="tabs" style="margin-top:12px"></div><div class="cats" id="cats"></div>
<div class="mu sm" id="cnt" style="margin:6px 0 12px"></div>
<div class="grid" id="gr"></div><div class="c" style="margin:20px"><button class="btn alt hide" id="more" data-i18n="load_more"></button></div>
</div></main>
<script>
TT.ready.then(()=>{
  const {t,esc,api,$}=TT; const u=new URLSearchParams(location.search);
  let st={tab:u.get('tab')||'all',cat:u.get('cat')||'all',q:u.get('q')||'',sort:'',page:1};
  const TABS=['all','hot','promo','new','women','men','elec','gift'], SEC={women:'w',men:'m',elec:'e',gift:'g'};
  $('#q').value=st.q;
  const draw=()=>{
    $('#tabs').innerHTML=TABS.map(x=>'<div class="chip '+(x===st.tab?'on':'')+'" data-tab="'+x+'">'+esc(t('tab_'+x))+'</div>').join('');
    $('#cats').innerHTML=['all',...TT.cfg.categories.map(c=>c.key)].map(c=>'<div class="cat '+(c===st.cat?'on':'')+'" data-cat="'+c+'"><span>'+(TT.EMOJI[c]||'✨')+'</span>'+esc(c==='all'?t('all'):TT.catName(c))+'</div>').join('');
    document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{st.tab=e.dataset.tab;st.page=1;draw();load(true)});
    document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{st.cat=e.dataset.cat;st.page=1;draw();load(true)});
  };
  let n=0;
  async function load(reset){
    const p=new URLSearchParams({page:st.page,limit:40,cat:st.cat,sort:st.sort}); if(st.q)p.set('q',st.q);
    if(SEC[st.tab])p.set('section',SEC[st.tab]); else if(st.tab!=='all')p.set('tab',st.tab);
    const r=await api('/api/products?'+p); if(reset){$('#gr').innerHTML='';n=0}
    $('#gr').insertAdjacentHTML('beforeend',r.items.map(TT.card).join('')); n+=r.items.length;
    $('#cnt').textContent=t('n_products',{n:r.total}); $('#more').classList.toggle('hide',n>=r.total);
    if(!r.total)$('#gr').innerHTML='<p class="mu">'+esc(t('empty'))+'</p>';
  }
  $('#more').onclick=()=>{st.page++;load()}; $('#sort').onchange=e=>{st.sort=e.target.value;st.page=1;load(true)};
  let tm; $('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value.trim();st.page=1;load(true)},300)};
  draw(); load(true);
});
</script></body></html>
